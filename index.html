<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/@microsoft/mgt@3/dist/bundle/mgt.loader.js"></script>
</head>
<body>
    <mgt-msal2-provider client-id="YOUR_AZURE_CLIENT_ID"></mgt-msal2-provider>
    <mgt-login></mgt-login>

    <div id="event-form">
        <input type="text" id="title" placeholder="Event Title">
        <input type="date" id="date">
        <input type="time" id="time">
        <input type="number" id="duration" placeholder="Duration (mins)">
        <button onclick="createEvent()">Create Event</button>
    </div>

    <script>
        async function createEvent() {
            const title = document.getElementById('title').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const duration = parseInt(document.getElementById('duration').value);

            const start = new Date(`${date}T${time}`);
            const end = new Date(start.getTime() + duration * 60000);

            const event = {
                subject: title,
                start: { dateTime: start.toISOString(), timeZone: 'UTC' },
                end: { dateTime: end.toISOString(), timeZone: 'UTC' }
            };

            try {
                // MSAL provider handles the token automatically
                await mgt.Providers.globalProvider.graph.api('/me/events').post(event);
                alert("Event Created!");
            } catch (err) {
                console.error(err);
                alert("Error creating event");
            }
        }
    </script>
</body>
</html>
